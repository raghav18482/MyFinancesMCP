# Alembic configuration. The database URL is not set here: migrations/env.py
# takes it from DATABASE_URL (via db.engine), the same place the app reads it.
#
#   alembic upgrade head        bring the database to this release's schema
#   alembic current             show the revision the database is at
#   alembic downgrade -1        step back one revision (see each revision's notes)
#
# The app also does this itself on startup (db.engine.init_db) unless
# DB_AUTO_MIGRATE=0.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
