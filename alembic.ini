# Alembic configuration. The database URL is never read from here: see
# migrations/env.py (MIGRATION_DATABASE_URL, Neon's direct endpoint).
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# Logging is configured by services/logging_config.py (env.py), so every
# handler carries the redaction filter. No [loggers] sections here.
